const ARTICLE_KEY = "spanish_article_errors";

function loadArticleErrors() {
  try { const raw = localStorage.getItem(ARTICLE_KEY); return raw ? JSON.parse(raw) : { wrong: {}, total: 0, correct: 0, log: {} }; }
  catch (e) { return { wrong: {}, total: 0, correct: 0, log: {} }; }
}
function saveArticleErrors(data) {
  try { localStorage.setItem(ARTICLE_KEY, JSON.stringify(data)); }
  catch (e) {}
}
function getTodayArticleLog(dk) {
  const data = loadArticleErrors();
  return (data.log || {})[dk || todayKey()] || [];
}
function saveArticleLog(entry) {
  const data = loadArticleErrors();
  if (!data.log) data.log = {};
  const dk = todayKey();
  if (!data.log[dk]) data.log[dk] = [];
  data.log[dk].push(entry);
  saveArticleErrors(data);
}

let articleState = { index: 0, answered: false, lastCorrect: false, lastAnswer: "", order: [], levelFilter: 0 };

// 掌握判定：连续做对 3 次才从错题队列移除
const ARTICLE_MASTER_AT = 3;

function articleInit() {
  articleState.index = 0;
  articleState.answered = false;
  articleState.order = articleBuildOrder();
}

// 构建出题顺序：错题优先 + 档位筛选
function articleBuildOrder() {
  const errs = loadArticleErrors();
  const lf = articleState.levelFilter || 0;

  // 先按档位筛出候选题目索引
  let candidates = ARTICLE_QUESTIONS.map((_, i) => i);
  if (lf > 0) {
    candidates = candidates.filter(i => ARTICLE_QUESTIONS[i].l === lf);
  }

  // 错题优先：还没掌握（连续正确<3次）的排前面
  const wrongIdx = candidates.filter(i => (errs.wrong[i] || 0) > 0);
  const freshIdx = candidates.filter(i => !(errs.wrong[i] || 0));

  // 错题内部：错得多的排前面，其余随机
  wrongIdx.sort((a, b) => (errs.wrong[b] || 0) - (errs.wrong[a] || 0));
  // 新题随机洗牌
  for (let i = freshIdx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [freshIdx[i], freshIdx[j]] = [freshIdx[j], freshIdx[i]];
  }

  return [...wrongIdx, ...freshIdx];
}

function renderArticle() {
  const container = document.getElementById("articleContainer");
  if (!articleState.order || articleState.order.length === 0) articleInit();

  // 档位筛选栏
  const errs = loadArticleErrors();
  const levels = [
    { id: 0, label: "全部" },
    { id: 1, label: "合音 al/del" },
    { id: 2, label: "零冠词" },
    { id: 3, label: "定冠词必用" },
    { id: 4, label: "泛指类别vs部分" },
    { id: 5, label: "混合" },
  ];

  let levelBar = `<div class="tense-selector" style="margin-bottom:12px;">`;
  levelBar += `<span style="font-size:0.7rem;color:var(--text-secondary);margin-right:4px;">档位</span>`;
  levels.forEach(lv => {
    const active = articleState.levelFilter === lv.id;
    levelBar += `<button class="tense-btn ${active ? "active-tense" : ""}" onclick="articleSetLevel(${lv.id})" style="font-size:0.72rem;padding:2px 8px;">${lv.label}</button>`;
  });
  levelBar += `</div>`;

  if (articleState.index >= articleState.order.length) {
    // 一轮完成
    const wrongLeft = Object.keys(errs.wrong).filter(i => (errs.wrong[i] || 0) > 0).length;
    container.innerHTML = `
      ${levelBar}
      <div class="quiz-score-bar">
        <span>🎉 本轮完成！</span>
        <span>✅ 正确率 ${errs.total > 0 ? Math.round(errs.correct / errs.total * 100) : 0}%</span>
      </div>
      <div class="quiz-prompt">
        <div class="verb-word">本轮 ${articleState.order.length} 题全部完成</div>
        <div class="quiz-person">还有 ${wrongLeft} 道错题待巩固（连续做对 3 次才算掌握）</div>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn primary" onclick="articleInit();renderArticle();">🔁 再练一轮</button>
      </div>`;
    return;
  }

  const q = ARTICLE_QUESTIONS[articleState.order[articleState.index]];
  const wrongCount = Object.keys(errs.wrong).filter(i => (errs.wrong[i] || 0) > 0).length;

  const display = q.s.replace("__", "____");

  let html = levelBar;
  html += `<div class="quiz-score-bar">
    <span>📝 第 ${articleState.index + 1} / ${articleState.order.length} 题</span>
    <span>❌ 待巩固 ${wrongCount} 题</span>
  </div>`;

  html += `<div class="quiz-prompt">
    <div class="verb-word" style="font-size:1.3rem;">${display}</div>
    <div class="quiz-person" style="font-size:0.85rem;color:var(--text-secondary);margin-top:8px;">填入正确的冠词（零冠词填 0）</div>
  </div>`;

  html += `<div class="quiz-input-row">
    <input type="text" id="articleInput" placeholder="el / la / un / una / 0 ..." autocomplete="off"
      ${articleState.answered ? "disabled" : ""}
      onkeydown="if(event.key==='Enter'){event.preventDefault();${articleState.answered ? "articleNext()" : "articleCheck()"};}">
    ${articleState.answered
      ? `<button class="quiz-next-btn" onclick="articleNext()">下一题 →</button>`
      : `<button class="quiz-submit" onclick="articleCheck()">检查</button>`}
  </div>`;

  if (articleState.answered) {
    if (articleState.lastCorrect) {
      html += `<div class="quiz-feedback show correct-ans">
        ✅ 正确！<span class="correct-form">${articleState.lastAnswer === "0" ? "（零冠词）" : articleState.lastAnswer}</span>
        <div class="explanation">${q.r}</div>
      </div>`;
    } else {
      html += `<div class="quiz-feedback show wrong-ans">
        ❌ 你填的是「<strong>${articleState.lastAnswer}</strong>」，正确答案是「<strong>${q.a === "0" ? "0（零冠词）" : q.a}</strong>」
        <div class="explanation">${q.r}</div>
      </div>`;
    }
  }

  container.innerHTML = html;
  if (!articleState.answered) document.getElementById("articleInput").focus();
}

function articleSetLevel(level) {
  articleState.levelFilter = level;
  articleInit();
  renderArticle();
}

function articleCheck() {
  if (articleState.answered) return;
  const input = document.getElementById("articleInput");
  const userAnswer = input.value.trim().toLowerCase();
  const q = ARTICLE_QUESTIONS[articleState.order[articleState.index]];
  const correct = q.a.toLowerCase();

  const isCorrect = userAnswer === correct;
  articleState.answered = true;
  articleState.lastCorrect = isCorrect;
  articleState.lastAnswer = userAnswer;

  const errs = loadArticleErrors();
  errs.total = (errs.total || 0) + 1;
  const qi = articleState.order[articleState.index];

  if (isCorrect) {
    errs.correct = (errs.correct || 0) + 1;
    // 连续做对计数，达到 3 次才从错题队列移除
    if (errs.wrong[qi] && errs.wrong[qi] > 0) {
      errs.wrong[qi]--;
      if (errs.wrong[qi] <= 0) delete errs.wrong[qi];
    }
  } else {
    errs.wrong[qi] = ARTICLE_MASTER_AT; // 重置为需连续做对3次
  }
  saveArticleErrors(errs);

  // 记录每日日志（题目 + 答案 + 对错）
  saveArticleLog({
    question: q.s.replace("__", "____"),
    correct: q.a === "0" ? "0（零冠词）" : q.a,
    userAnswer: articleState.lastAnswer,
    isCorrect: isCorrect
  });

  renderArticle();
}

function articleNext() {
  articleState.index++;
  articleState.answered = false;
  articleState.lastCorrect = false;
  articleState.lastAnswer = "";
  renderArticle();
}

const PREP_KEY = "spanish_prep_errors";

function loadPrepErrors() {
  try { const raw = localStorage.getItem(PREP_KEY); return raw ? JSON.parse(raw) : { wrong: {}, total: 0, correct: 0, log: {} }; }
  catch (e) { return { wrong: {}, total: 0, correct: 0, log: {} }; }
}
function savePrepErrors(data) {
  try { localStorage.setItem(PREP_KEY, JSON.stringify(data)); }
  catch (e) {}
}
function getTodayPrepLog(dk) {
  const data = loadPrepErrors();
  return (data.log || {})[dk || todayKey()] || [];
}
function savePrepLog(entry) {
  const data = loadPrepErrors();
  if (!data.log) data.log = {};
  const dk = todayKey();
  if (!data.log[dk]) data.log[dk] = [];
  data.log[dk].push(entry);
  savePrepErrors(data);
}

let prepState = { index: 0, answered: false, lastCorrect: false, lastAnswer: "", order: [], prepFilter: "" };
const PREP_MASTER_AT = 3;

function prepInit() {
  prepState.index = 0;
  prepState.answered = false;
  prepState.order = prepBuildOrder();
}

function prepBuildOrder() {
  const errs = loadPrepErrors();
  const pf = prepState.prepFilter || "";

  let candidates = PREP_QUESTIONS.map((_, i) => i);
  if (pf) {
    candidates = candidates.filter(i => PREP_QUESTIONS[i].p === pf);
  }

  const wrongIdx = candidates.filter(i => (errs.wrong[i] || 0) > 0);
  const freshIdx = candidates.filter(i => !(errs.wrong[i] || 0));
  wrongIdx.sort((a, b) => (errs.wrong[b] || 0) - (errs.wrong[a] || 0));
  for (let i = freshIdx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [freshIdx[i], freshIdx[j]] = [freshIdx[j], freshIdx[i]];
  }
  return [...wrongIdx, ...freshIdx];
}

function renderPrep() {
  const container = document.getElementById("prepContainer");
  if (!prepState.order || prepState.order.length === 0) prepInit();

  const errs = loadPrepErrors();
  const preps = [
    { id: "", label: "全部" },
    { id: "de", label: "de" },
    { id: "a", label: "a" },
    { id: "en", label: "en" },
    { id: "con", label: "con" },
    { id: "por", label: "por" },
  ];

  let bar = `<div class="tense-selector" style="margin-bottom:12px;">`;
  bar += `<span style="font-size:0.7rem;color:var(--text-secondary);margin-right:4px;">介词</span>`;
  preps.forEach(pp => {
    const active = prepState.prepFilter === pp.id;
    bar += `<button class="tense-btn ${active ? "active-tense" : ""}" onclick="prepSetFilter('${pp.id}')" style="font-size:0.72rem;padding:2px 8px;">${pp.label === "" ? "全部" : pp.label}</button>`;
  });
  bar += `</div>`;

  if (prepState.index >= prepState.order.length) {
    const wrongLeft = Object.keys(errs.wrong).filter(i => (errs.wrong[i] || 0) > 0).length;
    container.innerHTML = `
      ${bar}
      <div class="quiz-score-bar">
        <span>🎉 本轮完成！</span>
        <span>✅ 正确率 ${errs.total > 0 ? Math.round(errs.correct / errs.total * 100) : 0}%</span>
      </div>
      <div class="quiz-prompt">
        <div class="verb-word">本轮 ${prepState.order.length} 题全部完成</div>
        <div class="quiz-person">还有 ${wrongLeft} 道错题待巩固</div>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn primary" onclick="prepInit();renderPrep();">🔁 再练一轮</button>
      </div>`;
    return;
  }

  const q = PREP_QUESTIONS[prepState.order[prepState.index]];
  const wrongCount = Object.keys(errs.wrong).filter(i => (errs.wrong[i] || 0) > 0).length;

  let html = bar;
  html += `<div class="quiz-score-bar">
    <span>📝 第 ${prepState.index + 1} / ${prepState.order.length} 题</span>
    <span>❌ 待巩固 ${wrongCount} 题</span>
  </div>`;

  html += `<div class="quiz-prompt">
    <div class="verb-word" style="font-size:1.3rem;">${q.v} <span style="font-size:0.6em;color:var(--text-secondary);">(${q.m})</span> ___ algo</div>
    <div class="quiz-person" style="font-size:0.85rem;color:var(--text-secondary);margin-top:8px;">填入正确的介词</div>
  </div>`;

  html += `<div class="quiz-input-row">
    <input type="text" id="prepInput" placeholder="de / a / en / con / por" autocomplete="off"
      ${prepState.answered ? "disabled" : ""}
      onkeydown="if(event.key==='Enter'){event.preventDefault();${prepState.answered ? "prepNext()" : "prepCheck()"};}">
    ${prepState.answered
      ? `<button class="quiz-next-btn" onclick="prepNext()">下一题 →</button>`
      : `<button class="quiz-submit" onclick="prepCheck()">检查</button>`}
  </div>`;

  if (prepState.answered) {
    if (prepState.lastCorrect) {
      html += `<div class="quiz-feedback show correct-ans">
        ✅ 正确！<span class="correct-form">${q.p}</span>
        <div class="explanation">${q.e}</div>
      </div>`;
    } else {
      html += `<div class="quiz-feedback show wrong-ans">
        ❌ 你填的是「<strong>${prepState.lastAnswer}</strong>」，正确答案是「<strong>${q.p}</strong>」
        <div class="explanation">${q.e}</div>
      </div>`;
    }
  }

  container.innerHTML = html;
  if (!prepState.answered) document.getElementById("prepInput").focus();
}

function prepSetFilter(prep) {
  prepState.prepFilter = prep;
  prepInit();
  renderPrep();
}

function prepCheck() {
  if (prepState.answered) return;
  const input = document.getElementById("prepInput");
  const userAnswer = input.value.trim().toLowerCase();
  const q = PREP_QUESTIONS[prepState.order[prepState.index]];
  const correct = q.p.toLowerCase();

  const isCorrect = userAnswer === correct;
  prepState.answered = true;
  prepState.lastCorrect = isCorrect;
  prepState.lastAnswer = userAnswer;

  const errs = loadPrepErrors();
  errs.total = (errs.total || 0) + 1;
  const qi = prepState.order[prepState.index];

  if (isCorrect) {
    errs.correct = (errs.correct || 0) + 1;
    if (errs.wrong[qi] && errs.wrong[qi] > 0) {
      errs.wrong[qi]--;
      if (errs.wrong[qi] <= 0) delete errs.wrong[qi];
    }
  } else {
    errs.wrong[qi] = PREP_MASTER_AT;
  }
  savePrepErrors(errs);

  // 记录每日日志
  savePrepLog({
    verb: q.v,
    meaning: q.m,
    correct: q.p,
    userAnswer: prepState.lastAnswer,
    isCorrect: isCorrect
  });

  renderPrep();
}

function prepNext() {
  prepState.index++;
  prepState.answered = false;
  prepState.lastCorrect = false;
  prepState.lastAnswer = "";
  renderPrep();
}

function verbIdSetFilter(type) {
  verbIdState.typeFilter = type;
  verbIdInit();
  renderVerbId();
}

function verbIdCheck() {
  if (verbIdState.answered) return;
  const input = document.getElementById("verbIdInput");
  const userAnswer = input.value.trim().toLowerCase();
  const q = VERB_ID_QUESTIONS[verbIdState.order[verbIdState.index]];
  const correct = q.answer;

  const norm = s => s.toLowerCase().replace(/[íú]/g, m => ({ í: "i", ú: "u" }[m]))
    .replace(/[¿?¡!.,:;'"()]/g, "").replace(/\s+/g, " ").trim();
  const isCorrect = norm(userAnswer) === norm(correct);
  verbIdState.answered = true;
  verbIdState.lastCorrect = isCorrect;
  verbIdState.lastAnswer = userAnswer;

  const errs = loadVerbIdErrors();
  errs.total = (errs.total || 0) + 1;
  const qi = verbIdState.order[verbIdState.index];

  if (isCorrect) {
    errs.correct = (errs.correct || 0) + 1;
    if (errs.wrong[qi] && errs.wrong[qi] > 0) {
      errs.wrong[qi]--;
      if (errs.wrong[qi] <= 0) delete errs.wrong[qi];
    }
  } else {
    errs.wrong[qi] = VERB_ID_MASTER_AT;
  }
  saveVerbIdErrors(errs);

  saveVerbIdLog({
    type: q.type,
    verb: q.hint,
    meaning: q.zh,
    correct: correct,
    userAnswer: verbIdState.lastAnswer,
    isCorrect: isCorrect
  });

  renderVerbId();
}

function verbIdNext() {
  verbIdState.index++;
  verbIdState.answered = false;
  verbIdState.lastCorrect = false;
  verbIdState.lastAnswer = "";
  renderVerbId();
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 简易 markdown → HTML（用于笔记和汇总渲染）
function renderMarkdown(text) {
  var lines = text.split("\n");
  var out = [];
  var inTable = false, inCodeBlock = false, codeBuf = "";
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    // 代码块
    if (line.match(/^```/)) {
      if (inCodeBlock) {
        out.push("<pre><code>" + escapeHtml(codeBuf.trim()) + "</code></pre>");
        codeBuf = "";
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }
    if (inCodeBlock) { codeBuf += line + "\n"; continue; }
    // 表格
    var cells = line.split("|").map(function(c) { return c.trim(); });
    if (cells.length >= 2 && line.indexOf("|") >= 0 && !line.match(/^```/)) {
      if (!inTable && i + 1 < lines.length && lines[i + 1].match(/^\|[\s\-:|]+\|/)) {
        inTable = true;
        var hcells = cells.filter(function(c) { return c !== ""; });
        out.push("<table>");
        out.push("<tr>" + hcells.map(function(c) { return "<th>" + escapeHtml(c) + "</th>"; }).join("") + "</tr>");
        continue;
      }
      if (inTable && line.match(/^\|[\s\-:|]+\|/)) continue; // 表头分隔行
      if (inTable && line.indexOf("|") >= 0) {
        var dcells = cells.filter(function(c) { return c !== ""; });
        out.push("<tr>" + dcells.map(function(c) { return "<td>" + escapeHtml(c) + "</td>"; }).join("") + "</tr>");
        if (i + 1 >= lines.length || !lines[i + 1].match(/\|/)) { out.push("</table>"); inTable = false; }
        continue;
      }
    }
    if (inTable) { out.push("</table>"); inTable = false; }
    // 空行
    if (line.trim() === "") { out.push(""); continue; }
    // 标题
    var h6 = line.match(/^######\s+(.+)$/);
    var h5 = line.match(/^#####\s+(.+)$/);
    var h4 = line.match(/^####\s+(.+)$/);
    var h3 = line.match(/^###\s+(.+)$/);
    var h2 = line.match(/^##\s+(.+)$/);
    if (h6) { out.push("<h6>" + mdInline(h6[1]) + "</h6>"); continue; }
    if (h5) { out.push("<h5>" + mdInline(h5[1]) + "</h5>"); continue; }
    if (h4) { out.push("<h4>" + mdInline(h4[1]) + "</h4>"); continue; }
    if (h3) { out.push("<h4>" + mdInline(h3[1]) + "</h4>"); continue; }
    if (h2) { out.push("<h3>" + mdInline(h2[1]) + "</h3>"); continue; }
    // 横线
    if (line.match(/^---+$/)) { out.push("<hr>"); continue; }
    // 列表
    var li = line.match(/^[\-\*]\s+(.+)$/);
    if (li) { out.push("<li>" + mdInline(li[1]) + "</li>"); continue; }
    // 普通段落
    out.push("<p>" + mdInline(line) + "</p>");
  }
  if (inTable) { out.push("</table>"); }
  if (inCodeBlock) { out.push("<pre><code>" + escapeHtml(codeBuf.trim()) + "</code></pre>"); }
  return out.join("\n");
}
function mdInline(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

// ========== 练习 ==========

// 初始化文本格式：
// ---practice---
// title: 练习标题
// words: palabra1|释义1, palabra2|释义2, ...
// ---
// 文章内容（支持markdown纯文本）
function vocabCreatePractice() {
  let raw = document.getElementById("vocabInitInput").value.replace(/\r\n/g, "\n").trim();
  if (!raw) { alert("请粘贴初始化文本"); return; }

  // 判断是初始化文本还是批改结果
  if (/^---[\wáéíóúüñ]+---/m.test(raw) && !/^---practice---/m.test(raw)) {
    // 批改结果格式：---word--- 原句: ... 改句: ... 说明: ... ---
    vocabParseCorrections(raw);
    return;
  }

  // 解析初始化文本
  const pMatch = raw.match(/^---practice---\s*\n/);
  if (!pMatch) { alert("格式不识别。请粘贴以 ---practice--- 开头的初始化文本，或以 ---单词--- 开头的批改结果"); return; }

  const sepMatch = raw.match(/\n=+\n/);
  let header = "", article = "";
  if (sepMatch) {
    header = raw.substring(0, sepMatch.index);
    article = raw.substring(sepMatch.index + sepMatch[0].length).trim();
  } else {
    header = raw;
    article = "";
  }

  const titleMatch = header.match(/^title:\s*(.+)$/m);
  const wordsMatch = header.match(/^words:\s*(.+)$/m);
  if (!titleMatch || !wordsMatch) { alert("初始化文本缺少 title 或 words 字段"); return; }

  const title = titleMatch[1].trim();
  const words = wordsMatch[1].split(/[,;，；]+/).map(s => s.trim()).filter(Boolean).map(w => {
    const parts = w.split(/\|/);
    return { word: parts[0].trim(), meaning: parts[1] ? parts[1].trim() : "" };
  });

  const data = vocabLoadData();
  // 自动同步到词库
  words.forEach(w => {
    const existing = data.wordBank.find(bw => bw.word.toLowerCase() === w.word.toLowerCase());
    if (existing) {
      existing.appearances = (existing.appearances || 1) + 1;
      existing.lastSeen = todayKey();
      if (existing.meaning && !w.meaning) { /* keep old meaning */ }
      else if (!existing.meaning && w.meaning) { existing.meaning = w.meaning; }
    } else {
      data.wordBank.push({ word: w.word, meaning: w.meaning, firstFrom: title, appearances: 1, lastSeen: todayKey() });
    }
  });
  const practice = {
    id: vocabGenId(),
    date: todayKey(),
    title: title,
    words: words,
    article: article,
    sentences: [],       // user's original sentences, indexed by word order
    corrections: [],     // { word, original, corrected, note }
    status: "writing"    // writing | corrected
  };
  data.practices.unshift(practice);
  vocabSaveData(data);
  vocabActivePracticeId = practice.id;
  document.getElementById("vocabInitInput").value = "";
  vocabRenderPractice();
}

function vocabRenderPractice() {
  const data = vocabLoadData();
  let practice = null;
  if (vocabActivePracticeId) {
    practice = data.practices.find(p => p.id === vocabActivePracticeId);
    if (!practice) vocabActivePracticeId = null;
  }
  // 无活跃练习时显示最新的
  if (!practice && data.practices.length > 0) {
    practice = data.practices[0];
    vocabActivePracticeId = practice.id;
  }

  const container = document.getElementById("practiceContent");
  if (!practice) {
    container.innerHTML = `<div class="vocab-review-empty">还没有练习。<br>把新练习初始化文本粘贴到下方 → 点「创建练习」。</div>`;
    return;
  }

  // 词语标签
  const chips = practice.words.map(w =>
    `<span class="practice-word-chip"><span class="pw-word">${escapeHtml(w.word)}</span><span class="pw-meaning">${escapeHtml(w.meaning)}</span></span>`
  ).join("");

  // 文章
  const articleHtml = practice.article
    ? `<div class="practice-article"><h3>📖 ${escapeHtml(practice.title)}</h3>${vocabRenderArticle(practice.article)}</div>`
    : "";

  let bodyHtml = "";
  const statusLabel = practice.status === "corrected" ? "✅ 已批改" : "✏️ 造句中";
  const statusColor = practice.status === "corrected" ? "var(--success)" : "var(--accent)";

  bodyHtml += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-weight:600;">${escapeHtml(practice.title)}</span>
    <span style="font-size:0.78rem;color:${statusColor};">${statusLabel}</span>
  </div>`;
  bodyHtml += `<div class="practice-words-bar">${chips}</div>`;
  bodyHtml += articleHtml;

  if (practice.status === "corrected" && practice.corrections.length > 0) {
    // 显示批改结果
    bodyHtml += `<div style="font-weight:600;margin-bottom:8px;font-size:0.9rem;">📝 批改结果</div>`;
    practice.corrections.forEach(c => {
      const isOk = vocabIsSentenceCorrect(c.original || "", c.corrected || "");
      const statusClass = isOk ? "ok" : "err";
      const statusText = isOk ? "✓ 正确" : "✗ 有错";
      bodyHtml += `<div class="correction-item">
        <div class="ci-header"><span class="ci-word">${escapeHtml(c.word)}</span><span class="ci-status ${statusClass}">${statusText}</span></div>
        <div class="ci-orig"><span class="label">原句：</span>${escapeHtml(c.original || "")}</div>
        ${!isOk ? `<div class="ci-corr"><span class="label">改后：</span>${escapeHtml(c.corrected || "")}</div>` : ""}
        ${c.note ? `<div class="ci-note">${escapeHtml(c.note)}</div>` : ""}
      </div>`;
    });
  } else {
    // 造句区
    bodyHtml += `<div class="practice-sentence-area">
      <div class="psa-hint">用上面 ${practice.words.length} 个词各造一句（一次性写完，复制发给 Claude 批改）</div>
      <textarea id="practiceSentencesInput" placeholder="marchar: El coche no marcha bien.&#10;propósito: Mi propósito es aprobar el B2.&#10;...">${practice.sentences.map(s => s.word + ": " + s.text).join("\n")}</textarea>
      <button class="btn" onclick="vocabSaveSentences()" style="font-size:0.8rem;">💾 暂存句子</button>
    </div>`;
  }

  container.innerHTML = bodyHtml;
}

// 把 **text** 渲染为粗体，支持跨行
function vocabRenderArticle(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return html;
}

// 智能判断句子是否正确：✓标记 或 原句改句本质相同（仅差大小写/重音/标点/开头结尾空白）
function vocabIsSentenceCorrect(original, corrected) {
  if (corrected.match(/^[✓✅]|^\(✓/)) return true;
  const norm = function(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¡!¿?.,;:、，。；：""（）()\[\]]/g, "").trim().toLowerCase();
  };
  return norm(original) === norm(corrected);
}

function vocabSaveSentences() {
  const data = vocabLoadData();
  const practice = data.practices.find(p => p.id === vocabActivePracticeId);
  if (!practice) return;
  const raw = document.getElementById("practiceSentencesInput").value.trim();
  const lines = raw.split("\n").filter(Boolean);
  practice.sentences = lines.map(line => {
    const m = line.match(/^([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)\s*[:：]\s*(.*)$/);
    return m ? { word: m[1], text: m[2].trim() } : { word: "", text: line };
  });
  vocabSaveData(data);
  navigator.clipboard.writeText(raw).then(() => {
    alert("句子已暂存并复制到剪贴板！粘贴到 Claude 对话中即可。");
  });
}

// 解析批改格式：
// ---marchar---
// 原句: xxx
// 改句: yyy（或 (✓ 正确)）
// 说明: zzz（可选）
// ---
function vocabParseCorrections(raw) {
  const data = vocabLoadData();
  let practice = data.practices.find(p => p.id === vocabActivePracticeId);

  // 如果没有活跃练习，从批改数据自动创建一个
  if (!practice) {
    const blocks = raw.split(/^---/m).filter(b => b.trim());
    const words = [];
    blocks.forEach(block => {
      const word = block.trim().split("\n")[0].replace(/^---/, "").replace(/---$/, "").trim();
      if (word && word !== "practice") words.push({ word: word, meaning: "" });
    });
    if (words.length === 0) { alert("未识别到批改内容。"); return; }
    practice = {
      id: vocabGenId(),
      date: todayKey(),
      title: "造句练习 · " + words.map(w => w.word).join("、"),
      words: words,
      article: "",
      sentences: [],
      corrections: [],
      status: "writing"
    };
    data.practices.unshift(practice);
    vocabActivePracticeId = practice.id;
    // 同步词库
    words.forEach(w => {
      const existing = data.wordBank.find(bw => bw.word.toLowerCase() === w.word.toLowerCase());
      if (existing) { existing.appearances = (existing.appearances || 1) + 1; existing.lastSeen = todayKey(); }
      else { data.wordBank.push({ word: w.word, meaning: w.meaning, firstFrom: practice.title, appearances: 1, lastSeen: todayKey() }); }
    });
  }

  // 按 ---word--- 分割
  const blocks = raw.split(/^---/m).filter(b => b.trim());
  const corrections = [];

  blocks.forEach(block => {
    const lines = block.trim().split("\n");
    const word = lines[0].replace(/^---/, "").replace(/---$/, "").trim();
    if (!word || word === "practice") return;

    const origMatch = block.match(/原句\s*[：:]\s*(.+)/);
    const corrMatch = block.match(/改句\s*[：:]\s*(.+)/);
    const noteMatch = block.match(/说明\s*[：:]\s*(.+)/);

    const isOk = vocabIsSentenceCorrect(origMatch ? origMatch[1].trim() : "", corrMatch ? corrMatch[1].trim() : "");
    corrections.push({
      word: word,
      original: origMatch ? origMatch[1].trim() : "",
      corrected: corrMatch ? corrMatch[1].trim() : "",
      note: noteMatch ? noteMatch[1].trim() : ""
    });
  });

  if (corrections.length === 0) { alert("未识别到批改内容。请确认格式：---单词--- 原句: ... 改句: ... 说明: ... ---"); return; }

  practice.corrections = corrections;
  practice.status = "corrected";
  vocabSaveData(data);
  document.getElementById("vocabInitInput").value = "";
  vocabRenderPractice();
}

// ========== 历史 ==========

function vocabRenderHistory() {
  const data = vocabLoadData();
  const container = document.getElementById("vocabTabHistory");
  const practices = data.practices;

  if (practices.length === 0) {
    container.innerHTML = `<div class="vocab-review-empty">还没有完成的练习。</div>`;
    return;
  }

  container.innerHTML = practices.map(p => {
    const statusLabel = p.status === "corrected" ? "✅ 已批改" : "✏️ 造句中";
    const statusColor = p.status === "corrected" ? "var(--success)" : "var(--accent)";
    const wordCount = p.words.length;
    return `<div class="practice-history-item">
      <div style="flex:1;min-width:0;" onclick="vocabOpenPractice('${p.id}')">
        <div class="phi-title">${escapeHtml(p.title)}</div>
        <div class="phi-meta">${p.date} · ${wordCount} 个词</div>
      </div>
      <span class="phi-status" style="background:${statusColor}20;color:${statusColor};">${statusLabel}</span>
      <button class="vw-delete" onclick="event.stopPropagation();vocabDeletePractice('${p.id}')" title="删除" style="margin-left:6px;">✕</button>
    </div>`;
  }).join("");

  if (practices.length > 1) {
    container.innerHTML += `<div style="text-align:right;margin-top:8px;"><button class="btn danger" onclick="vocabClearHistory()" style="font-size:0.7rem;">🗑 清空全部历史</button></div>`;
  }
}

function vocabDeletePractice(id) {
  const data = vocabLoadData();
  const p = data.practices.find(p => p.id === id);
  if (!confirm(`删除 "${p.title}"？`)) return;
  data.practices = data.practices.filter(p => p.id !== id);
  if (vocabActivePracticeId === id) vocabActivePracticeId = null;
  vocabSaveData(data);
  vocabRenderHistory();
}

function vocabClearHistory() {
  if (!confirm("确定要清空全部历史吗？此操作不可撤销。")) return;
  const data = vocabLoadData();
  data.practices = [];
  vocabActivePracticeId = null;
  vocabSaveData(data);
  vocabRenderHistory();
}

function vocabOpenPractice(id) {
  vocabActivePracticeId = id;
  vocabSwitchTab("practice");
}

// ========== 词库 ==========

function vocabRenderWordBank() {
  const data = vocabLoadData();
  const words = data.wordBank;
  // 按最近出现倒序
  words.sort((a, b) => {
    const da = a.lastSeen || "";
    const db = b.lastSeen || "";
    if (da > db) return -1; if (da < db) return 1; return 0;
  });
  const total = words.length;
  const totalApps = words.reduce((s, w) => s + (w.appearances || 1), 0);

  document.getElementById("vocabWordBankStats").innerHTML = `共 <strong>${total}</strong> 个词 · 累计出现 <strong>${totalApps}</strong> 次`;

  if (words.length === 0) {
    document.getElementById("vocabWordBankList").innerHTML = `<div class="vocab-review-empty">还没有单词。<br>创建练习时词会自动加入，也可以手动添加。</div>`;
    return;
  }

  document.getElementById("vocabWordBankList").innerHTML = words.map((w, i) => {
    const apps = w.appearances || 1;
    const from = w.firstFrom ? `来自：${w.firstFrom}` : "手动添加";
    return `<div class="vocab-word-card">
      <span class="vw-word">${escapeHtml(w.word)}</span>
      <span class="vw-meaning">${escapeHtml(w.meaning || "")}</span>
      <span style="font-size:0.7rem;color:var(--text-secondary);" title="${escapeHtml(from)}">${apps}期</span>
      <button class="vw-delete" onclick="vocabWordBankDelete(${i})">✕</button>
    </div>`;
  }).join("");
}

function vocabWordBankShowAdd() {
  document.getElementById("vocabWordBankForm").style.display = "block";
  document.getElementById("vocabWordBankInput").focus();
}

function vocabWordBankHideAdd() {
  document.getElementById("vocabWordBankForm").style.display = "none";
}

function vocabWordBankBulkAdd() {
  const raw = document.getElementById("vocabWordBankInput").value.trim();
  if (!raw) return;
  const data = vocabLoadData();
  let added = 0, skipped = 0;

  // 简单按行和分隔符拆分
  const tokens = raw.split(/[\n,;，；]+/).map(s => s.trim()).filter(Boolean);
  tokens.forEach(token => {
    // 尝试 "word meaning" 格式
    const pair = token.match(/^([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)\s+(.+)$/);
    const word = pair ? pair[1] : token;
    const meaning = pair ? pair[2] : "";
    if (data.wordBank.find(w => w.word.toLowerCase() === word.toLowerCase())) { skipped++; return; }
    data.wordBank.push({ word: word, meaning: meaning, firstFrom: "手动添加", appearances: 1, lastSeen: todayKey() });
    added++;
  });

  vocabSaveData(data);
  document.getElementById("vocabWordBankInput").value = "";
  vocabWordBankHideAdd();
  vocabRenderWordBank();
  if (skipped > 0) alert(`已添加 ${added} 个词，跳过 ${skipped} 个重复词`);
}

function vocabWordBankDelete(idx) {
  const data = vocabLoadData();
  if (!confirm(`删除 "${data.wordBank[idx].word}"？`)) return;
  data.wordBank.splice(idx, 1);
  vocabSaveData(data);
  vocabRenderWordBank();
}

// ========== 数据导出导入 ==========
const ALL_DATA_KEYS = [
  "spanish_checkins",
  "spanish_journal_v2",
  "spanish_summaries",
  "spanish_conj_log",
  "spanish_vocab_practice",
  "spanish_article_errors",
  "spanish_prep_errors",
  "spanish_verb_id_errors"
];

function exportAllData() {
  const bundle = {};
  ALL_DATA_KEYS.forEach(key => {
    const raw = localStorage.getItem(key);
    bundle[key] = raw ? JSON.parse(raw) : {};
  });
  bundle._exportDate = todayKey();
  bundle._version = "1.0";

  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `西语学习数据_${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importAllData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const bundle = JSON.parse(e.target.result);
      if (!bundle._exportDate || !bundle._version) {
        alert("文件格式不正确，请选择通过「导出数据」生成的文件");
        return;
      }
      let imported = 0;
      ALL_DATA_KEYS.forEach(key => {
        if (bundle[key] && Object.keys(bundle[key]).length > 0) {
          const existing = localStorage.getItem(key);
          if (existing && Object.keys(JSON.parse(existing)).length > 0) {
            if (!confirm(`${key} 已有数据，是否覆盖？\n选择「取消」将合并新旧数据`)) {
              // 合并模式
              const existingData = JSON.parse(existing);
              const merged = { ...bundle[key], ...existingData }; // 新数据优先
              localStorage.setItem(key, JSON.stringify(merged));
              imported += Object.keys(bundle[key]).length;
              return;
            }
          }
          localStorage.setItem(key, JSON.stringify(bundle[key]));
          imported += Object.keys(bundle[key]).length;
        }
      });
      alert(`已导入 ${bundle._exportDate} 的数据！（共 ${imported} 条记录）\n页面即将刷新...`);
      location.reload();
    } catch (err) {
      alert("导入失败，文件可能已损坏\n" + err.message);
    }
  };
  reader.readAsText(file);
}

// ========== 键盘快捷键 ==========
document.addEventListener("keydown", e => {
  // 焦点在输入框/文本框时，不触发快捷键
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;

  if (e.key === "1") toggleCheckin("ds");
  if (e.key === "2") toggleCheckin("anki");
  if (e.key === "3") toggleCheckin("leer");
  if (e.key === "4") toggleCheckin("escribir");
  if (e.key === "5") toggleCheckin("conjugar");
  if (e.key === "6") toggleCheckin("hablar");
  if (e.key === "a" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); checkAll(); }
  if (e.key === "t") switchView("today");
  if (e.key === "w") switchView("week");
  if (e.key === "p") switchView("progress");
  if (e.key === "c") switchView("conjugation");
  if (e.key === "j") switchView("journal");
  if (e.key === "s") switchView("summary");
  if (e.key === "v") switchView("vocab");
  if (e.key === "g") switchView("article");
  if (e.key === "k") switchView("prep");
  if (e.key === "m") switchView("verbid");
});

// ========== 初始化 ==========
renderAll();

// ========== 自动备份 ==========
// 每天首次打开页面自动备份到 localStorage + 浏览器下载文件夹
// 浏览器安全限制：无法写入项目文件夹；请手动移动下载文件到项目目录
(function autoBackup() {
  const BACKUP_KEY = "_last_backup_date";
  const BACKUP_DATA_PREFIX = "_auto_backup_data_";
  var today = todayKey();
  var lastBackup = localStorage.getItem(BACKUP_KEY);

  var statusEl = document.getElementById("backupStatus");
  function updateStatus() {
    if (!lastBackup) {
      statusEl.textContent = "⚠️ 从未自动备份";
    } else if (lastBackup === today) {
      statusEl.textContent = "✅ 今日已备份 | " + today;
    } else {
      var daysAgo = Math.floor((new Date(today + "T00:00:00") - new Date(lastBackup + "T00:00:00")) / 86400000);
      statusEl.textContent = "⚠️ 上次备份 " + lastBackup + "（" + daysAgo + " 天前）";
    }
  }
  updateStatus();

  // 确认今天有数据才备份
  var ci = loadCheckins();
  if (!ci[today] || Object.keys(ci[today]).length === 0) return;
  if (lastBackup === today) return;

  setTimeout(function() {
    try {
      var bundle = {};
      ALL_DATA_KEYS.forEach(function(key) {
        var raw = localStorage.getItem(key);
        bundle[key] = raw ? JSON.parse(raw) : {};
      });
      bundle._exportDate = today;
      bundle._version = "1.0";
      bundle._auto_backup = true;

      // 1) 存到 localStorage，始终保留最近 7 天
      localStorage.setItem(BACKUP_DATA_PREFIX + today, JSON.stringify(bundle));
      // 清理超过 7 天的
      for (var i = 7; i <= 14; i++) {
        var oldDate = new Date(new Date(today + "T00:00:00") - i * 86400000);
        var oldKey = BACKUP_DATA_PREFIX + oldDate.toISOString().split("T")[0];
        if (localStorage.getItem(oldKey)) localStorage.removeItem(oldKey);
      }

      // 2) 浏览器下载（进入默认下载文件夹）
      var blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "西语学习数据_" + today + ".json";  // 同名文件浏览器会自动在后面加 (1)
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      localStorage.setItem(BACKUP_KEY, today);
      updateStatus();
    } catch(e) {
      console.warn("自动备份失败", e);
    }
  }, 3000);
})();
</script>
