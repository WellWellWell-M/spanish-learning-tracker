// ========== 遗忘词练 ==========
const VOCAB_KEY = "spanish_vocab_practice";

function vocabLoadData() {
  try { const raw = localStorage.getItem(VOCAB_KEY); return raw ? JSON.parse(raw) : { practices: [], wordBank: [] }; }
  catch (e) { return { practices: [], wordBank: [] }; }
}
function vocabSaveData(data) {
  try { localStorage.setItem(VOCAB_KEY, JSON.stringify(data)); }
  catch (e) {}
}
function vocabGenId() {
  return "vp_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
}

let vocabActiveTab = "practice";
let vocabActivePracticeId = null;

function vocabSwitchTab(tab) {

// ========== 练习 ==========

// 初始化文本格式：
// ---practice---
// title: 练习标题
// words: palabra1|释义1, palabra2|释义2, ...
// ---
// 文章内容（支持markdown纯文本）
function vocabCreatePractice() {
  let raw = document.getElementById("vocabInitInput").value.replace(/\r\n/g, "\n").trim();
  if (!raw) { alert("请粘贴初始化文本"); return; }

  // 判断是初始化文本还是批改结果
  if (/^---[\wáéíóúüñ]+---/m.test(raw) && !/^---practice---/m.test(raw)) {
    // 批改结果格式：---word--- 原句: ... 改句: ... 说明: ... ---
    vocabParseCorrections(raw);
    return;
  }

  // 解析初始化文本
  const pMatch = raw.match(/^---practice---\s*\n/);
  if (!pMatch) { alert("格式不识别。请粘贴以 ---practice--- 开头的初始化文本，或以 ---单词--- 开头的批改结果"); return; }

  const sepMatch = raw.match(/\n=+\n/);
  let header = "", article = "";
  if (sepMatch) {
    header = raw.substring(0, sepMatch.index);
    article = raw.substring(sepMatch.index + sepMatch[0].length).trim();
  } else {
    header = raw;
    article = "";
  }

  const titleMatch = header.match(/^title:\s*(.+)$/m);
  const wordsMatch = header.match(/^words:\s*(.+)$/m);
  if (!titleMatch || !wordsMatch) { alert("初始化文本缺少 title 或 words 字段"); return; }

  const title = titleMatch[1].trim();
  const words = wordsMatch[1].split(/[,;，；]+/).map(s => s.trim()).filter(Boolean).map(w => {
    const parts = w.split(/\|/);
    return { word: parts[0].trim(), meaning: parts[1] ? parts[1].trim() : "" };
  });

  const data = vocabLoadData();
  // 自动同步到词库
  words.forEach(w => {
    const existing = data.wordBank.find(bw => bw.word.toLowerCase() === w.word.toLowerCase());
    if (existing) {
      existing.appearances = (existing.appearances || 1) + 1;
      existing.lastSeen = todayKey();
      if (existing.meaning && !w.meaning) { /* keep old meaning */ }
      else if (!existing.meaning && w.meaning) { existing.meaning = w.meaning; }
    } else {
      data.wordBank.push({ word: w.word, meaning: w.meaning, firstFrom: title, appearances: 1, lastSeen: todayKey() });
    }
  });
  const practice = {
    id: vocabGenId(),
    date: todayKey(),
    title: title,
    words: words,
    article: article,
    sentences: [],       // user's original sentences, indexed by word order
    corrections: [],     // { word, original, corrected, note }
    status: "writing"    // writing | corrected
  };
  data.practices.unshift(practice);
  vocabSaveData(data);
  vocabActivePracticeId = practice.id;
  document.getElementById("vocabInitInput").value = "";
  vocabRenderPractice();
}

function vocabRenderPractice() {
  const data = vocabLoadData();
  let practice = null;
  if (vocabActivePracticeId) {
    practice = data.practices.find(p => p.id === vocabActivePracticeId);
    if (!practice) vocabActivePracticeId = null;
  }
  // 无活跃练习时显示最新的
  if (!practice && data.practices.length > 0) {
    practice = data.practices[0];
    vocabActivePracticeId = practice.id;
  }

  const container = document.getElementById("practiceContent");
  if (!practice) {
    container.innerHTML = `<div class="vocab-review-empty">还没有练习。<br>把新练习初始化文本粘贴到下方 → 点「创建练习」。</div>`;
    return;
  }

  // 词语标签
  const chips = practice.words.map(w =>
    `<span class="practice-word-chip"><span class="pw-word">${escapeHtml(w.word)}</span><span class="pw-meaning">${escapeHtml(w.meaning)}</span></span>`
  ).join("");

  // 文章
  const articleHtml = practice.article
    ? `<div class="practice-article"><h3>📖 ${escapeHtml(practice.title)}</h3>${vocabRenderArticle(practice.article)}</div>`
    : "";

  let bodyHtml = "";
  const statusLabel = practice.status === "corrected" ? "✅ 已批改" : "✏️ 造句中";
  const statusColor = practice.status === "corrected" ? "var(--success)" : "var(--accent)";

  bodyHtml += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-weight:600;">${escapeHtml(practice.title)}</span>
    <span style="font-size:0.78rem;color:${statusColor};">${statusLabel}</span>
  </div>`;
  bodyHtml += `<div class="practice-words-bar">${chips}</div>`;
  bodyHtml += articleHtml;

  if (practice.status === "corrected" && practice.corrections.length > 0) {
    // 显示批改结果
    bodyHtml += `<div style="font-weight:600;margin-bottom:8px;font-size:0.9rem;">📝 批改结果</div>`;
    practice.corrections.forEach(c => {
      const isOk = vocabIsSentenceCorrect(c.original || "", c.corrected || "");
      const statusClass = isOk ? "ok" : "err";
      const statusText = isOk ? "✓ 正确" : "✗ 有错";
      bodyHtml += `<div class="correction-item">
        <div class="ci-header"><span class="ci-word">${escapeHtml(c.word)}</span><span class="ci-status ${statusClass}">${statusText}</span></div>
        <div class="ci-orig"><span class="label">原句：</span>${escapeHtml(c.original || "")}</div>
        ${!isOk ? `<div class="ci-corr"><span class="label">改后：</span>${escapeHtml(c.corrected || "")}</div>` : ""}
        ${c.note ? `<div class="ci-note">${escapeHtml(c.note)}</div>` : ""}
      </div>`;
    });
  } else {
    // 造句区
    bodyHtml += `<div class="practice-sentence-area">
      <div class="psa-hint">用上面 ${practice.words.length} 个词各造一句（一次性写完，复制发给 Claude 批改）</div>
      <textarea id="practiceSentencesInput" placeholder="marchar: El coche no marcha bien.&#10;propósito: Mi propósito es aprobar el B2.&#10;...">${practice.sentences.map(s => s.word + ": " + s.text).join("\n")}</textarea>
      <button class="btn" onclick="vocabSaveSentences()" style="font-size:0.8rem;">💾 暂存句子</button>
    </div>`;
  }

  container.innerHTML = bodyHtml;
}

// 把 **text** 渲染为粗体，支持跨行
function vocabRenderArticle(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return html;
}

// 智能判断句子是否正确：✓标记 或 原句改句本质相同（仅差大小写/重音/标点/开头结尾空白）
function vocabIsSentenceCorrect(original, corrected) {
  if (corrected.match(/^[✓✅]|^\(✓/)) return true;
  const norm = function(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¡!¿?.,;:、，。；：""（）()\[\]]/g, "").trim().toLowerCase();
  };
  return norm(original) === norm(corrected);
}

function vocabSaveSentences() {
  const data = vocabLoadData();
  const practice = data.practices.find(p => p.id === vocabActivePracticeId);
  if (!practice) return;
  const raw = document.getElementById("practiceSentencesInput").value.trim();
  const lines = raw.split("\n").filter(Boolean);
  practice.sentences = lines.map(line => {
    const m = line.match(/^([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)\s*[:：]\s*(.*)$/);
    return m ? { word: m[1], text: m[2].trim() } : { word: "", text: line };
  });
  vocabSaveData(data);
  navigator.clipboard.writeText(raw).then(() => {
    alert("句子已暂存并复制到剪贴板！粘贴到 Claude 对话中即可。");
  });
}

// 解析批改格式：
// ---marchar---
// 原句: xxx
// 改句: yyy（或 (✓ 正确)）
// 说明: zzz（可选）
// ---
function vocabParseCorrections(raw) {
  const data = vocabLoadData();
  let practice = data.practices.find(p => p.id === vocabActivePracticeId);

  // 如果没有活跃练习，从批改数据自动创建一个
  if (!practice) {
    const blocks = raw.split(/^---/m).filter(b => b.trim());
    const words = [];
    blocks.forEach(block => {
      const word = block.trim().split("\n")[0].replace(/^---/, "").replace(/---$/, "").trim();
      if (word && word !== "practice") words.push({ word: word, meaning: "" });
    });
    if (words.length === 0) { alert("未识别到批改内容。"); return; }
    practice = {
      id: vocabGenId(),
      date: todayKey(),
      title: "造句练习 · " + words.map(w => w.word).join("、"),
      words: words,
      article: "",
      sentences: [],
      corrections: [],
      status: "writing"
    };
    data.practices.unshift(practice);
    vocabActivePracticeId = practice.id;
    // 同步词库
    words.forEach(w => {
      const existing = data.wordBank.find(bw => bw.word.toLowerCase() === w.word.toLowerCase());
      if (existing) { existing.appearances = (existing.appearances || 1) + 1; existing.lastSeen = todayKey(); }
      else { data.wordBank.push({ word: w.word, meaning: w.meaning, firstFrom: practice.title, appearances: 1, lastSeen: todayKey() }); }
    });
  }

  // 按 ---word--- 分割
  const blocks = raw.split(/^---/m).filter(b => b.trim());
  const corrections = [];

  blocks.forEach(block => {
    const lines = block.trim().split("\n");
    const word = lines[0].replace(/^---/, "").replace(/---$/, "").trim();
    if (!word || word === "practice") return;

    const origMatch = block.match(/原句\s*[：:]\s*(.+)/);
    const corrMatch = block.match(/改句\s*[：:]\s*(.+)/);
    const noteMatch = block.match(/说明\s*[：:]\s*(.+)/);

    const isOk = vocabIsSentenceCorrect(origMatch ? origMatch[1].trim() : "", corrMatch ? corrMatch[1].trim() : "");
    corrections.push({
      word: word,
      original: origMatch ? origMatch[1].trim() : "",
      corrected: corrMatch ? corrMatch[1].trim() : "",
      note: noteMatch ? noteMatch[1].trim() : ""
    });
  });

  if (corrections.length === 0) { alert("未识别到批改内容。请确认格式：---单词--- 原句: ... 改句: ... 说明: ... ---"); return; }

  practice.corrections = corrections;
  practice.status = "corrected";
  vocabSaveData(data);
  document.getElementById("vocabInitInput").value = "";
  vocabRenderPractice();
}

// ========== 历史 ==========

function vocabRenderHistory() {
  const data = vocabLoadData();
  const container = document.getElementById("vocabTabHistory");
  const practices = data.practices;

  if (practices.length === 0) {
    container.innerHTML = `<div class="vocab-review-empty">还没有完成的练习。</div>`;
    return;
  }

  container.innerHTML = practices.map(p => {
    const statusLabel = p.status === "corrected" ? "✅ 已批改" : "✏️ 造句中";
    const statusColor = p.status === "corrected" ? "var(--success)" : "var(--accent)";
    const wordCount = p.words.length;
    return `<div class="practice-history-item">
      <div style="flex:1;min-width:0;" onclick="vocabOpenPractice('${p.id}')">
        <div class="phi-title">${escapeHtml(p.title)}</div>
        <div class="phi-meta">${p.date} · ${wordCount} 个词</div>
      </div>
      <span class="phi-status" style="background:${statusColor}20;color:${statusColor};">${statusLabel}</span>
      <button class="vw-delete" onclick="event.stopPropagation();vocabDeletePractice('${p.id}')" title="删除" style="margin-left:6px;">✕</button>
    </div>`;
  }).join("");

  if (practices.length > 1) {
    container.innerHTML += `<div style="text-align:right;margin-top:8px;"><button class="btn danger" onclick="vocabClearHistory()" style="font-size:0.7rem;">🗑 清空全部历史</button></div>`;
  }
}

function vocabDeletePractice(id) {
  const data = vocabLoadData();
  const p = data.practices.find(p => p.id === id);
  if (!confirm(`删除 "${p.title}"？`)) return;
  data.practices = data.practices.filter(p => p.id !== id);
  if (vocabActivePracticeId === id) vocabActivePracticeId = null;
  vocabSaveData(data);
  vocabRenderHistory();
}

function vocabClearHistory() {
  if (!confirm("确定要清空全部历史吗？此操作不可撤销。")) return;
  const data = vocabLoadData();
  data.practices = [];
  vocabActivePracticeId = null;
  vocabSaveData(data);
  vocabRenderHistory();
}

function vocabOpenPractice(id) {
  vocabActivePracticeId = id;
  vocabSwitchTab("practice");
}

// ========== 词库 ==========

function vocabRenderWordBank() {
  const data = vocabLoadData();
  const words = data.wordBank;
  // 按最近出现倒序
  words.sort((a, b) => {
    const da = a.lastSeen || "";
    const db = b.lastSeen || "";
    if (da > db) return -1; if (da < db) return 1; return 0;
  });
  const total = words.length;
  const totalApps = words.reduce((s, w) => s + (w.appearances || 1), 0);

  document.getElementById("vocabWordBankStats").innerHTML = `共 <strong>${total}</strong> 个词 · 累计出现 <strong>${totalApps}</strong> 次`;

  if (words.length === 0) {
    document.getElementById("vocabWordBankList").innerHTML = `<div class="vocab-review-empty">还没有单词。<br>创建练习时词会自动加入，也可以手动添加。</div>`;
    return;
  }

  document.getElementById("vocabWordBankList").innerHTML = words.map((w, i) => {
    const apps = w.appearances || 1;
    const from = w.firstFrom ? `来自：${w.firstFrom}` : "手动添加";
    return `<div class="vocab-word-card">
      <span class="vw-word">${escapeHtml(w.word)}</span>
      <span class="vw-meaning">${escapeHtml(w.meaning || "")}</span>
      <span style="font-size:0.7rem;color:var(--text-secondary);" title="${escapeHtml(from)}">${apps}期</span>
      <button class="vw-delete" onclick="vocabWordBankDelete(${i})">✕</button>
    </div>`;
  }).join("");
}

function vocabWordBankShowAdd() {
  document.getElementById("vocabWordBankForm").style.display = "block";
  document.getElementById("vocabWordBankInput").focus();
}

function vocabWordBankHideAdd() {
  document.getElementById("vocabWordBankForm").style.display = "none";
}

function vocabWordBankBulkAdd() {
  const raw = document.getElementById("vocabWordBankInput").value.trim();
  if (!raw) return;
  const data = vocabLoadData();
  let added = 0, skipped = 0;

  // 简单按行和分隔符拆分
  const tokens = raw.split(/[\n,;，；]+/).map(s => s.trim()).filter(Boolean);
  tokens.forEach(token => {
    // 尝试 "word meaning" 格式
    const pair = token.match(/^([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)\s+(.+)$/);
    const word = pair ? pair[1] : token;
    const meaning = pair ? pair[2] : "";
    if (data.wordBank.find(w => w.word.toLowerCase() === word.toLowerCase())) { skipped++; return; }
    data.wordBank.push({ word: word, meaning: meaning, firstFrom: "手动添加", appearances: 1, lastSeen: todayKey() });
    added++;
  });

  vocabSaveData(data);
  document.getElementById("vocabWordBankInput").value = "";
  vocabWordBankHideAdd();
  vocabRenderWordBank();
  if (skipped > 0) alert(`已添加 ${added} 个词，跳过 ${skipped} 个重复词`);
}

function vocabWordBankDelete(idx) {
  const data = vocabLoadData();
  if (!confirm(`删除 "${data.wordBank[idx].word}"？`)) return;
  data.wordBank.splice(idx, 1);
  vocabSaveData(data);
  vocabRenderWordBank();
}

// ========== 数据导出导入 ==========
const ALL_DATA_KEYS = [
  "spanish_checkins",
  "spanish_journal_v2",
  "spanish_summaries",
  "spanish_conj_log",
  "spanish_vocab_practice"
];

function exportAllData() {
  const bundle = {};
  ALL_DATA_KEYS.forEach(key => {
    const raw = localStorage.getItem(key);
    bundle[key] = raw ? JSON.parse(raw) : {};
  });
  bundle._exportDate = todayKey();
  bundle._version = "1.0";

  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `西语学习数据_${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importAllData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const bundle = JSON.parse(e.target.result);
      if (!bundle._exportDate || !bundle._version) {
        alert("文件格式不正确，请选择通过「导出数据」生成的文件");
        return;
      }
      let imported = 0;
      ALL_DATA_KEYS.forEach(key => {
        if (bundle[key] && Object.keys(bundle[key]).length > 0) {
          const existing = localStorage.getItem(key);
          if (existing && Object.keys(JSON.parse(existing)).length > 0) {
            if (!confirm(`${key} 已有数据，是否覆盖？\n选择「取消」将合并新旧数据`)) {
              // 合并模式
              const existingData = JSON.parse(existing);
              const merged = { ...bundle[key], ...existingData }; // 新数据优先
              localStorage.setItem(key, JSON.stringify(merged));
              imported += Object.keys(bundle[key]).length;
              return;
            }
          }
          localStorage.setItem(key, JSON.stringify(bundle[key]));
          imported += Object.keys(bundle[key]).length;
        }
      });
      alert(`已导入 ${bundle._exportDate} 的数据！（共 ${imported} 条记录）\n页面即将刷新...`);
      location.reload();
    } catch (err) {
      alert("导入失败，文件可能已损坏\n" + err.message);
    }
  };
  reader.readAsText(file);
}

// ========== 键盘快捷键 ==========
document.addEventListener("keydown", e => {
  // 焦点在输入框/文本框时，不触发快捷键
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;

  if (e.key === "1") toggleCheckin("ds");
  if (e.key === "2") toggleCheckin("anki");
  if (e.key === "3") toggleCheckin("leer");
  if (e.key === "4") toggleCheckin("escribir");
  if (e.key === "5") toggleCheckin("conjugar");
  if (e.key === "6") toggleCheckin("hablar");
  if (e.key === "a" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); checkAll(); }
  if (e.key === "t") switchView("today");
  if (e.key === "w") switchView("week");
  if (e.key === "p") switchView("progress");
  if (e.key === "c") switchView("conjugation");
  if (e.key === "j") switchView("journal");
  if (e.key === "s") switchView("summary");
  if (e.key === "v") switchView("vocab");
});

// ========== 初始化 ==========
renderAll();

// ========== 自动备份 ==========
// 每天首次打开页面自动备份到 localStorage + 浏览器下载文件夹
// 浏览器安全限制：无法写入项目文件夹；请手动移动下载文件到项目目录
(function autoBackup() {
  const BACKUP_KEY = "_last_backup_date";
  const BACKUP_DATA_PREFIX = "_auto_backup_data_";
  var today = todayKey();
  var lastBackup = localStorage.getItem(BACKUP_KEY);

  var statusEl = document.getElementById("backupStatus");
  function updateStatus() {
    if (!lastBackup) {
      statusEl.textContent = "⚠️ 从未自动备份";
    } else if (lastBackup === today) {
      statusEl.textContent = "✅ 今日已备份 | " + today;
    } else {
      var daysAgo = Math.floor((new Date(today + "T00:00:00") - new Date(lastBackup + "T00:00:00")) / 86400000);
      statusEl.textContent = "⚠️ 上次备份 " + lastBackup + "（" + daysAgo + " 天前）";
    }
  }
  updateStatus();

  // 确认今天有数据才备份
  var ci = loadCheckins();
  if (!ci[today] || Object.keys(ci[today]).length === 0) return;
  if (lastBackup === today) return;

  setTimeout(function() {
    try {
      var bundle = {};
      ALL_DATA_KEYS.forEach(function(key) {
        var raw = localStorage.getItem(key);
        bundle[key] = raw ? JSON.parse(raw) : {};
      });
      bundle._exportDate = today;
      bundle._version = "1.0";
      bundle._auto_backup = true;

      // 1) 存到 localStorage，始终保留最近 7 天
      localStorage.setItem(BACKUP_DATA_PREFIX + today, JSON.stringify(bundle));
      // 清理超过 7 天的
      for (var i = 7; i <= 14; i++) {
        var oldDate = new Date(new Date(today + "T00:00:00") - i * 86400000);
        var oldKey = BACKUP_DATA_PREFIX + oldDate.toISOString().split("T")[0];
        if (localStorage.getItem(oldKey)) localStorage.removeItem(oldKey);
      }

      // 2) 浏览器下载（进入默认下载文件夹）
      var blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "西语学习数据_" + today + ".json";  // 同名文件浏览器会自动在后面加 (1)
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      localStorage.setItem(BACKUP_KEY, today);
      updateStatus();
    } catch(e) {
      console.warn("自动备份失败", e);
    }
  }, 3000);
})();
</script>
